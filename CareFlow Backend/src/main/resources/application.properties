spring.application.name=CareFlow Backend

# Server Configuration
server.port=8080

# PostgreSQL (Supabase) Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for Supabase Cloud Database)
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# Supabase Transaction Pooler (PgBouncer port 6543) Compatibility
# Disables server-side named prepared statements to prevent "prepared statement already exists" / parameter mismatch errors in transaction pooling mode
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
careflow.app.jwtSecret=${JWT_SECRET}
careflow.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
careflow.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
careflow.upload.dir=${UPLOAD_DIR:./uploads/patient-documents}

