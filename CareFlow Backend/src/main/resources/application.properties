spring.application.name=CareFlow Backend

# Server Configuration (Supports Render.com dynamic PORT injection)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL (Supabase) Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for Render 512MB & Supabase Pooler)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Supabase Transaction Pooler (PgBouncer port 6543) & SSL Compatibility
# Disables server-side named prepared statements and stabilizes TLS handshakes
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.socketTimeout=30

# JPA, Hibernate & Repository Bootstrap Configuration (Optimized for 512MB RAM / 0.1 vCPU)
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
careflow.app.jwtSecret=${JWT_SECRET:Y2FyZWZsb3ctaG1zLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2LXhs}
careflow.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
careflow.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
careflow.upload.dir=${UPLOAD_DIR:./uploads/patient-documents}

