# ==============================================================================
# Render.com Blueprint Specification for CareFlow HMS Backend
# ==============================================================================
services:
  - type: web
    name: careflow-hms-backend
    runtime: docker
    rootDir: CareFlow Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/health
    envVars:
      - key: PORT
        value: 8080
      - key: TZ
        value: Asia/Colombo
      - key: UPLOAD_DIR
        value: /app/uploads/patient-documents
      - key: JAVA_OPTS
        value: "-Xms96m -Xmx220m -XX:MaxMetaspaceSize=110m -XX:CompressedClassSpaceSize=24m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djdk.tls.client.protocols=TLSv1.2 -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

